{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Sign in</h1>
  <p class="muted">Access your Primus dashboard.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="identity">Username or email</label>
    <input id="identity" name="identity" type="text" value="{{ identity or '' }}" required autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <label class="checkbox">
      <input type="checkbox" name="remember" value="1"> Remember me
    </label>
    <button type="submit" class="button">Sign in</button>
  </form>
  <p class="muted">No account? <a href="{{ url_for('auth.register') }}">Register</a>.</p>
</section>
{% endblock %}
