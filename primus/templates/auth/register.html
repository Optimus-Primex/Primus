{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Create an account</h1>
  <p class="muted">Start monitoring your endpoints.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" value="{{ form.username or '' }}" required minlength="3" maxlength="64" pattern="[A-Za-z0-9_.-]+" autocomplete="username">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ form.email or '' }}" required autocomplete="email">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
    <button type="submit" class="button">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>.</p>
</section>
{% endblock %}
