[package]
name = "primus-registry"
version = "0.1.0"
edition = "2021"
rust-version = "1.84.0"
description = "On-chain monitor registry and status attestations for Primus"
license = "MIT"
repository = "https://github.com/Primex-Tech/Primus"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28"

[dev-dependencies]
soroban-sdk = { version = "28", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
