name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PRIMUS_ENV: development
      PRIMUS_SECRET_KEY: ci-secret-key-not-for-production
      FLASK_APP: run.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Run tests
        run: pytest --cov=primus --cov-report=term-missing

      - name: Validate migrations apply
        env:
          PRIMUS_DATABASE_URL: sqlite:///ci-migrate.db
        run: |
          flask db upgrade
          python -c "import sqlite3; print(sorted(r[0] for r in sqlite3.connect('ci-migrate.db').execute(\"select name from sqlite_master where type='table'\")))"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t primus:ci .
